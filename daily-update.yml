name: Daily Update

on:
  schedule:
    # Run at 6:00 AM EST (11:00 UTC)
    - cron: '0 11 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Update timestamp
        run: |
          # Create a file with the current timestamp
          echo "Last updated: $(date)" > build-timestamp.txt
          cat build-timestamp.txt
      
      - name: Generate build info
        run: |
          # Append build info to index.html (optional - for visibility)
          echo "<!-- Build: $(date) -->" >> index.html
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: $(date)")
      
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
